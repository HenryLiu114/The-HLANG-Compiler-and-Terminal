<!DOCTYPE html>
<html>

<head>
    <link rel="icon" type="image/png" href="../imgs/SimpleLogo.png">
    <title>Online Compiler</title>
</head>

<body>
    <link rel="stylesheet" href="styles.css">

    <div class="page">
        <div class="header2">Online Compiler (Not Working Right Now)</div>
        <div class="codespace">
            <textarea class="inputbox" id="codeEditor" placeholder="Type code here..."></textarea>
            <div class="outputbox">
                <div class="filespace">

                    <div class="runbutton">
                        <div class="runtext">
                            <img class="runicon" src="../imgs/play-solid-full.svg">
                        </div>
                    </div>
                    <div class="savebutton">
                        <div class="runtext">
                            <img class="runicon" src="../imgs/floppy-disk-solid-full.svg">
                        </div>
                    </div>
                    <div class="clearbutton">
                        <div class="runtext">
                            <img class="runicon" src="../imgs/trash-solid-full.svg">
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
    <div id="navbar"></div>
    <script src="script.js"></script>

    <script>
        document.getElementById("navbar").innerHTML = navbar();

        const textarea = document.getElementById('codeEditor');

        textarea.addEventListener('keydown', function (e) {
            // Check if the pressed key is "Tab"
            if (e.key === 'Tab') {
                // Prevent the browser from moving focus to the next element
                e.preventDefault();

                // Get the current cursor position
                const start = this.selectionStart;
                const end = this.selectionEnd;

                // Set your preferred tab character (e.g., a real tab '\t' or spaces '  ')
                const tabCharacter = '\t';

                // Insert the tab character at the cursor position
                this.value = this.value.substring(0, start) + tabCharacter + this.value.substring(end);

                // Put the cursor right after the newly inserted tab character
                this.selectionStart = this.selectionEnd = start + tabCharacter.length;
            }
            else if (e.key == '{'){
                // Prevent the browser from moving focus to the next element
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start)+'{}' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start+1;
            }
            else if (e.key == '('){
                // Prevent the browser from moving focus to the next element
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start)+'()' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start+1;
            }
            else if (e.key == '['){
                // Prevent the browser from moving focus to the next element
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start)+'[]' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start+1;
            }
        });
    </script>
    </div>




</body>

</html>
